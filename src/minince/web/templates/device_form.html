{% extends "base.html" %}
{% block title %}{% if action == 'create' %}添加设备{% else %}编辑设备{% endif %} - MiniNCE{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{% if action == 'create' %}添加设备{% else %}编辑设备{% endif %}</h1>
    <div class="subtitle">配置网络设备连接信息</div>
</div>

<div class="card">
    <div class="card-header">
        <h2>设备信息</h2>
        <a href="/devices" class="btn btn-ghost btn-sm">返回列表</a>
    </div>
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
    <form method="post" action="{% if action == 'create' %}/devices{% else %}/devices/{{ device.id }}{% endif %}">
        <div class="grid-2">
            <div class="form-group">
                <label>设备名称 *</label>
                <input type="text" name="name" value="{{ device.name if device and device.name else '' }}" required {% if action == 'update' %}readonly{% endif %}>
            </div>
            <div class="form-group">
                <label>主机名</label>
                <input type="text" name="hostname" value="{{ device.hostname if device and device.hostname else '' }}">
            </div>
            <div class="form-group">
                <label>管理IP *</label>
                <input type="text" name="management_ip" value="{{ device.management_ip if device and device.management_ip else '' }}" required placeholder="192.168.1.1" class="mono">
            </div>
            <div class="form-group">
                <label>端口</label>
                <input type="number" name="port" value="{{ device.port if device and device.port else 22 }}" min="1" max="65535" class="mono">
            </div>
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" name="username" value="{{ device.username if device and device.username else '' }}" required>
            </div>
            <div class="form-group">
                <label>密码{% if action == 'create' %} *{% endif %}</label>
                <input type="password" name="password" {% if action == 'create' %}required{% endif %} placeholder="{% if action == 'update' %}留空则不修改{% else %}请输入密码{% endif %}">
            </div>
            <div class="form-group">
                <label>厂商</label>
                <select name="vendor">
                    {% for v in ['HUAWEI', 'CISCO', 'H3C', 'JUNIPER', 'GENERIC'] %}
                    <option value="{{ v }}" {% if device and device.vendor == v %}selected{% endif %}>{{ v }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>设备类型</label>
                <select name="device_type">
                    {% for t in ['ROUTER', 'SWITCH'] %}
                    <option value="{{ t }}" {% if device and device.device_type == t %}selected{% endif %}>{{ '路由器' if t == 'ROUTER' else '交换机' }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>连接类型</label>
                <select name="connection_type">
                    {% for c in ['SSH', 'TELNET', 'CONSOLE'] %}
                    <option value="{{ c }}" {% if device and device.connection_type == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>平台/型号</label>
                <input type="text" name="platform" value="{{ device.platform if device and device.platform else '' }}">
            </div>
            <div class="form-group">
                <label>描述</label>
                <input type="text" name="description" value="{{ device.description if device and device.description else '' }}">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                {% if action == 'create' %}创建设备{% else %}保存修改{% endif %}
            </button>
            <a href="/devices" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
