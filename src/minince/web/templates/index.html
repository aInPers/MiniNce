{% extends "base.html" %}
{% block title %}首页 - MiniNCE{% endblock %}
{% block content %}
<div class="page-header">
    <h1>控制台</h1>
    <div class="subtitle">网络自动化配置平台总览</div>
</div>

<div class="card" style="margin-bottom:18px">
    <div class="stat-card" style="margin-bottom:0">
        <div class="stat-icon" style="background:var(--color-primary-bg);color:var(--color-primary)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <div class="stat-value">{{ device_count }}</div>
        <div class="stat-label">设备总数</div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2>快捷操作</h2>
    </div>
    <div class="grid-2">
        <a href="/devices/new" class="action-card">
            <span class="ac-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </span>
            添加设备
            <span class="ac-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </span>
        </a>
        <a href="/manual-config" class="action-card">
            <span class="ac-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </span>
            手动配置设备
            <span class="ac-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </span>
        </a>
    </div>
</div>
{% endblock %}
