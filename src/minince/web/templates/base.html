<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MiniNCE - 网络自动化配置平台{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #1a365d 0%, #2d3748 100%);
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            color: white;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            margin-right: 40px;
        }
        .navbar-nav {
            display: flex;
            list-style: none;
            gap: 8px;
        }
        .navbar-nav a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .navbar-nav a:hover, .navbar-nav a.active {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #edf2f7;
        }
        .card-header h2 {
            color: #1a365d;
            font-size: 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-danger {
            background: #e53e3e;
            color: white;
        }
        .btn-danger:hover { background: #c53030; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-group { display: flex; gap: 8px; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
        }
        th {
            background: #f7fafc;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover { background: #f7fafc; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-DRAFT { background: #edf2f7; color: #4a5568; }
        .status-VALIDATING { background: #fefcbf; color: #744210; }
        .status-READY { background: #bee3f8; color: #2c5282; }
        .status-RUNNING { background: #bee3f8; color: #2c5282; }
        .status-VERIFYING { background: #c6f6d5; color: #22543d; }
        .status-SUCCEEDED { background: #c6f6d5; color: #22543d; }
        .status-FAILED { background: #fed7d7; color: #742a2a; }
        .status-PARTIAL { background: #fefcbf; color: #744210; }
        .status-ACTIVE { background: #c6f6d5; color: #22543d; }
        .status-INACTIVE { background: #edf2f7; color: #4a5568; }
        .status-ERROR { background: #fed7d7; color: #742a2a; }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .form-group .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group .checkbox-group input { width: auto; }
        .error-message {
            background: #fed7d7;
            color: #742a2a;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .navbar-nav { gap: 4px; }
            .navbar-nav a { padding: 6px 10px; font-size: 13px; }
        }
        .section-title {
            font-size: 16px;
            color: #2d3748;
            margin: 20px 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        pre.command-output {
            background: #1a202c;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 6px;
            font-family: "Fira Code", monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .risk-warning {
            background: #fffaf0;
            border: 1px solid #f6ad55;
            color: #744210;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .warnings-box {
            background: #fffaf0;
            border: 1px solid #f6ad55;
            color: #744210;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .warnings-box ul { margin: 8px 0 0 20px; }
        .warnings-box li { margin-bottom: 4px; }
        .info-box {
            background: #f7fafc;
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 16px;
            color: #2d3748;
            font-weight: 600;
        }
        .btn-group form { display: inline; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">MiniNCE</a>
        <ul class="navbar-nav">
            <li><a href="/" class="{% if active_page == 'home' %}active{% endif %}">首页</a></li>
            <li><a href="/devices" class="{% if active_page == 'devices' %}active{% endif %}">设备管理</a></li>
            <li><a href="/tasks" class="{% if active_page == 'tasks' %}active{% endif %}">任务管理</a></li>
            <li><a href="/templates" class="{% if active_page == 'templates' %}active{% endif %}">配置模板</a></li>
            <li><a href="/backups" class="{% if active_page == 'backups' %}active{% endif %}">配置备份</a></li>
        </ul>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
